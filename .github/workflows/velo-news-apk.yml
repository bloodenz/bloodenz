name: Build VELO NEWS APK
on:
  push:
    paths:
      - 'velo-news-apk/**'
      - '.github/workflows/velo-news-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velo-news-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VELO-NEWS-APK
          path: velo-news-apk/app/build/outputs/apk/debug/app-debug.apk
