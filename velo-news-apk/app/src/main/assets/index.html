<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>VELO NEWS</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7f9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:80px}.top{padding:24px 18px 12px;font-size:26px;font-weight:900}.v{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#ff5a1f,#ffb000);color:#111;margin-right:8px}.hero{margin:8px 16px 18px;padding:22px;border:1px solid #29313a;border-radius:26px;background:linear-gradient(145deg,#18202a,#11151a)}.ey{color:#ffb000;font-size:11px;font-weight:800;letter-spacing:.16em}.hero h1{font-size:33px;line-height:1;margin:10px 0}.hero p,.card p{color:#aeb8c3;line-height:1.45}.chips{display:flex;overflow:auto;gap:8px;padding:0 16px 14px}.chip{padding:9px 13px;border-radius:999px;background:#151a20;border:1px solid #2a323b;color:#dce1e6;white-space:nowrap}.chip.on{background:#f4f6f8;color:#111;font-weight:800}.search{margin:0 16px 16px;width:calc(100% - 32px);padding:14px;border-radius:14px;border:1px solid #2c3540;background:#151a20;color:#fff}.feed{padding:0 12px}.card{margin:10px 0;padding:16px;border:1px solid #27303a;border-radius:20px;background:#13181e}.meta{font-size:12px;color:#8d98a5}.tag{color:#ffb000;font-weight:800}.card h2{font-size:19px;margin:8px 0}.btn{border:0;border-radius:12px;padding:10px 12px;background:#ff5a1f;color:white;font-weight:800}nav{position:fixed;left:12px;right:12px;bottom:12px;background:#171c22eF;border:1px solid #303944;border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr)}nav button{background:none;border:0;color:#9ba5b1;padding:10px 3px}nav button.on{background:#f4f6f8;color:#111;border-radius:13px;font-weight:800}</style></head><body><div class="top"><span class="v">V</span>VELO NEWS</div><section class="hero"><div class="ey">BIKE INDUSTRY • COMMUNITY • EVENTS</div><h1>Велосипедный мир в одной ленте.</h1><p>MTB, BMX, gravel, e-bike, индустрия, новинки и события. Без двадцати одинаковых перепечаток.</p></section><div class="chips" id="chips"></div><input id="q" class="search" placeholder="Поиск: Rampage, Shimano, MTB…"><main class="feed" id="feed"></main><nav><button class="on">Новости</button><button>События</button><button>★ Избранное</button><button>⚙ Ещё</button></nav><script>const cats=['Главное','Россия','Индустрия','MTB','BMX','Gravel','E-bike','Новинки','Видео'];let cat='Главное';const news=[{c:'Индустрия',s:'Bicycle Retailer',t:'Новости велоиндустрии в одной ленте',d:'Рабочая APK-версия VELO NEWS. Для живой ленты приложение подключается к серверу-агрегатору RSS и официальным API.'},{c:'MTB',s:'Pinkbike / MTB',t:'MTB, freeride и большие события',d:'Отдельная категория для соревнований, видео, райдеров, команд и ключевых событий мировой MTB-сцены.'},{c:'Новинки',s:'Brand Newsrooms',t:'Новые велосипеды, компоненты и технологии',d:'Новости брендов можно объединять с обзорами профильных медиа и убирать дубли.'},{c:'Видео',s:'YouTube',t:'Видео брендов, команд и райдеров',d:'YouTube подключается через официальный API. VK, Telegram и Meta требуют отдельных разрешений и токенов.'},{c:'Россия',s:'VELO NEWS RU',t:'Российские события и индустрия',d:'Локальные старты, фестивали, магазины, дистрибьюторы, команды и MTB-комьюнити.'}];function draw(){let q=document.querySelector('#q').value.toLowerCase();let a=news.filter(n=>(cat==='Главное'||n.c===cat)&&(n.t+n.d+n.s).toLowerCase().includes(q));document.querySelector('#feed').innerHTML=a.map(n=>`<article class=card><div class=meta><span class=tag>${n.c}</span> · ${n.s}</div><h2>${n.t}</h2><p>${n.d}</p><button class=btn onclick="this.textContent=this.textContent==='★ Сохранить'?'★ Сохранено':'★ Сохранить'">★ Сохранить</button></article>`).join('')||'<article class=card>Ничего не найдено.</article>'}let ch=document.querySelector('#chips');cats.forEach(x=>{let b=document.createElement('button');b.className='chip'+(x===cat?' on':'');b.textContent=x;b.onclick=()=>{cat=x;[...ch.children].forEach(y=>y.classList.toggle('on',y===b));draw()};ch.appendChild(b)});document.querySelector('#q').oninput=draw;draw();</script></body></html>
